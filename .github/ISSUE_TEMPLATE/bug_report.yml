name: Bug Report
description: Report an issue, crash, or unexpected behavior in whatsapp-ai-gateway
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is a security vulnerability or multi-tenant data leak, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/whatsapp-ai-gateway/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the issue.
      placeholder: |
        1. Start server with `npm start`
        2. Attempt to register tenant session
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Node.js version, OS, Baileys version.
      placeholder: |
        - Node.js Version: 18.x / 20.x
        - OS: Ubuntu 22.04 / Debian 12 / Windows 11
        - Database: SQLite / PostgreSQL
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Logs
      description: Paste relevant server logs (ensure tokens, phone numbers, and keys are sanitized).